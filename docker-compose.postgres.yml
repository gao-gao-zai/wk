services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workbuddy
      POSTGRES_USER: workbuddy
      # 必须由 .env / 环境提供；缺失时 compose 直接报错而不是用公开占位符。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbuddy -d workbuddy"]
      interval: 5s
      timeout: 5s
      retries: 12

  wb2api:
    environment:
      - WB2A_POSTGRES_DSN=postgres://workbuddy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/workbuddy?sslmode=prefer
      - WB2A_POSTGRES_MAX_OPEN_CONNS=32
      - WB2A_POSTGRES_MAX_IDLE_CONNS=16
    depends_on:
      postgres:
        condition: service_healthy
